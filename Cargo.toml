[package]
name = "odotui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "TUI con herramientas para desarrollar con Odoo, usable con mouse y teclado"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
flate2 = "1.1.10"
libc = "0.2.191"
pbkdf2 = "0.12"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "io-std", "fs", "net"] }
tokio-util = "0.7.20"
toml = "1.1.8"
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
